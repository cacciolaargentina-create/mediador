<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puente Digital — Admin</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#12181A">
<!-- corre ANTES de pintar: si no, quien eligió modo claro ve un flash oscuro
     (el tema por default) hasta que site-common.js carga al final del body. -->
<script>(function(){try{var t=localStorage.getItem('pd_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12181A; --surface:#1B2326; --surface-2:#222C30; --line:#2E393D;
    --text:#E7EDEC; --text-dim:#93A3A2; --text-faint:#5E6E6D;
    --calm:#5FA8A0; --calm-dim:#3E6E69; --warn:#D98C4A; --warn-dim:#5A4327;
    --danger:#C4614A; --danger-dim:#4A2C23; --header-bg:rgba(18,24,26,0.92);
    --serif:'Fraunces',serif; --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  :root[data-theme="light"]{
    --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#EBF0EF; --line:#DCE4E2;
    --text:#16211F; --text-dim:#4C5C59; --text-faint:#7C8C89;
    --calm:#2E7A72; --calm-dim:#D9EDE9; --warn:#A85A1D; --warn-dim:#FBE8D2;
    --danger:#B23A24; --danger-dim:#F8DFD8; --header-bg:rgba(244,247,246,0.92);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  html.theme-anim, html.theme-anim *{ transition:background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease !important; }
  .icon-btn{ background:none; border:1px solid var(--line); color:var(--text-dim); width:30px; height:30px; border-radius:7px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-btn:hover{ border-color:var(--calm-dim); color:var(--text); }
  @keyframes theme-icon-pop{ 0%{ transform:rotate(0) scale(1); } 45%{ transform:rotate(160deg) scale(0.65); } 100%{ transform:rotate(360deg) scale(1); } }
  .icon-btn.animating{ animation:theme-icon-pop .5s ease; }

  .wrap{ max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px; }
  .brand{ font-family:var(--serif); font-weight:600; font-size:19px; }
  .brand em{ font-style:italic; color:var(--calm); font-weight:500; }
  .brand-sub{ font-family:var(--mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.07em; margin-top:2px; }
  .user-chip{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); }
  .user-chip img{ width:26px; height:26px; border-radius:50%; }
  .user-chip a, .user-chip button{ background:none; border:1px solid var(--line); color:var(--text-dim); font-size:11.5px; padding:6px 10px; border-radius:7px; cursor:pointer; font-family:var(--sans); text-decoration:none; }
  .user-chip a:hover, .user-chip button:hover{ border-color:var(--calm-dim); color:var(--text); }

  /* ---- nav de secciones: horizontal en pantallas anchas, <select> en angostas ---- */
  .admin-nav{ display:flex; gap:2px; margin-bottom:26px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .admin-nav button{ background:none; border:none; color:var(--text-dim); font-size:12.5px; padding:10px 14px; cursor:pointer; font-family:var(--sans); border-bottom:2px solid transparent; white-space:nowrap; }
  .admin-nav button:hover{ color:var(--text); }
  .admin-nav button.active{ color:var(--calm); border-bottom-color:var(--calm); }
  .admin-nav-select{ display:none; }
  @media (max-width:760px){
    .admin-nav{ display:none; }
    .admin-nav-select{
      display:block; width:100%; margin-bottom:22px; background:var(--surface); border:1px solid var(--line);
      color:var(--text); font-family:var(--sans); font-size:13.5px; padding:11px 12px; border-radius:8px;
    }
  }

  .row-copy{ display:flex; gap:8px; }
  .row-copy input{ flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-family:var(--mono); font-size:11px; padding:8px 9px; border-radius:6px; }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-bottom:32px; }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .stat-card .num{ font-family:var(--serif); font-size:27px; font-weight:600; line-height:1; }
  .stat-card .lab{ font-size:12px; color:var(--text-dim); margin-top:6px; }
  .stat-card .sub{ font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-top:6px; line-height:1.4; }

  section.block{ margin-bottom:32px; }
  h2.block-title{ font-family:var(--serif); font-size:16px; font-weight:600; margin-bottom:12px; }

  .table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.min-w{ min-width:600px; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  th{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); font-weight:500; }
  td{ color:var(--text-dim); }
  td.strong{ color:var(--text); font-weight:600; }

  .pill{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 8px; border-radius:10px; }
  .pill.guest{ background:var(--warn-dim); color:var(--warn); }
  .pill.google{ background:var(--calm-dim); color:var(--calm); }
  .pill.danger{ background:var(--danger-dim); color:var(--danger); }
  .pill.warn{ background:var(--warn-dim); color:var(--warn); }
  .pill.ok{ background:var(--calm-dim); color:var(--calm); }

  .chart-card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .chart-legend{ display:flex; gap:16px; margin-bottom:14px; font-size:11.5px; color:var(--text-dim); }
  .chart-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .chart-legend .sw{ width:9px; height:9px; border-radius:2px; display:inline-block; }
  .chart-note{ font-size:11px; color:var(--text-faint); margin-top:10px; line-height:1.4; }

  .center-note{ text-align:center; padding:22vh 20px 20px; color:var(--text-dim); font-size:14px; line-height:1.6; }
  .center-note .brand{ font-size:25px; margin-bottom:14px; display:block; }
  button.google-btn{ display:flex; align-items:center; gap:10px; background:#fff; color:#1F1F1F; border:none; font-weight:600; font-size:14px; padding:12px 22px; border-radius:8px; cursor:pointer; font-family:var(--sans); margin:18px auto 0; }
  .empty-hint{ padding:18px; color:var(--text-faint); font-size:12.5px; text-align:center; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .eyebrow{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:10px; }
  .field-label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
  .card input, .card select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--sans); font-size:13px; padding:9px 10px; border-radius:7px;
  }
  .card input:focus, .card select:focus{ outline:none; border-color:var(--calm-dim); }
  button.ghost{
    background:var(--calm-dim); color:var(--text); border:1px solid var(--calm-dim);
    font-family:var(--sans); font-size:13px; font-weight:600; padding:10px 14px; border-radius:7px; cursor:pointer;
  }
  button.ghost:hover{ border-color:var(--calm); }
</style>
</head>
<body>
<div id="app"><div class="center-note">Cargando…</div></div>
<script src="/site-common.js"></script>
<script src="/admin.js"></script>
</body>
</html>
