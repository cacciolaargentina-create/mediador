<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi mediación</title>
<link rel="icon" type="image/svg+xml" href="/mediador-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/layout.css">
<link rel="stylesheet" href="/styles/responsive.css">
<style>
  /* portal de partes: sin sidebar (Bloque 20 §26 — "no mostrar navegación
     interna del mediador"), solo la marca arriba y el contenido. */
  .portal-header{ display:flex; align-items:center; padding:14px 20px; border-bottom:1px solid var(--color-border-light); background:var(--color-surface); }
  .portal-main{ max-width:600px; margin:0 auto; padding:24px 20px 60px; }
  .item{ padding:10px 0; border-bottom:1px solid var(--color-border-light); }
  .item:last-child{ border-bottom:none; }
</style>
</head>
<body>
  <div class="mediador-app">
    <header class="portal-header">
      <div class="mediador-logo on-light">
        <img class="mediador-logo-mark" src="/mediador-icon.svg" alt="">
        <span class="mediador-logo-text">Mediador</span>
      </div>
    </header>
    <main class="portal-main" id="main"><p class="empty-hint">Cargando…</p></main>
  </div>
  <script src="/portal.js"></script>
</body>
</html>
