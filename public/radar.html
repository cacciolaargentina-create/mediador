<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mediador — Radar competitivo</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0F1517">
<meta name="robots" content="noindex, nofollow">
<script>(function(){try{var t=localStorage.getItem('pd_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1517; --surface:#172326; --surface-2:#193033; --line:#2A3A3D;
    --text:#F4F7F7; --text-dim:#93A3A2; --text-faint:#5E6E6D;
    --calm:#22C7B8; --calm-dim:#123B38; --warn:#D79B2B; --warn-dim:#4A3712;
    --danger:#D95353; --danger-dim:#4A1F1F; --header-bg:rgba(15,21,23,0.92);
    --serif:'Inter',sans-serif; --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  }
  :root[data-theme="light"]{
    --bg:#F5F8F8; --surface:#FFFFFF; --surface-2:#F2F6F6; --line:#DDE5E6;
    --text:#172124; --text-dim:#667477; --text-faint:#8A989A;
    --calm:#159B91; --calm-dim:#E6FAF7; --warn:#D79B2B; --warn-dim:#FFF6DF;
    --danger:#D95353; --danger-dim:#FCEBEC; --header-bg:rgba(245,248,248,0.92);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  .wrap{ max-width:1180px; margin:0 auto; padding:28px 20px 60px; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px; }
  .brand{ font-family:var(--serif); font-weight:600; font-size:19px; }
  .brand em{ font-style:italic; color:var(--calm); font-weight:500; }
  .brand-sub{ font-family:var(--mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.07em; margin-top:2px; }
  .user-chip{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); }
  .user-chip a{ background:none; border:1px solid var(--line); color:var(--text-dim); font-size:11.5px; padding:6px 10px; border-radius:7px; cursor:pointer; font-family:var(--sans); text-decoration:none; }
  .user-chip a:hover{ border-color:var(--calm-dim); color:var(--text); }

  .radar-nav{ display:flex; gap:2px; margin-bottom:26px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .radar-nav button{ background:none; border:none; color:var(--text-dim); font-size:12.5px; padding:10px 14px; cursor:pointer; font-family:var(--sans); border-bottom:2px solid transparent; white-space:nowrap; }
  .radar-nav button:hover{ color:var(--text); }
  .radar-nav button.active{ color:var(--calm); border-bottom-color:var(--calm); }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-bottom:32px; }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .stat-card .num{ font-family:var(--serif); font-size:27px; font-weight:600; line-height:1; }
  .stat-card .lab{ font-size:12px; color:var(--text-dim); margin-top:6px; }

  section.block{ margin-bottom:32px; }
  h2.block-title{ font-family:var(--serif); font-size:16px; font-weight:600; margin-bottom:12px; }
  p.block-note{ font-size:12px; color:var(--text-faint); margin:-6px 0 12px; line-height:1.5; }

  .table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.min-w{ min-width:700px; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }
  th{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); font-weight:500; }
  td{ color:var(--text-dim); }
  td.strong{ color:var(--text); font-weight:600; }
  td.evidence{ max-width:320px; white-space:normal; font-size:11.5px; color:var(--text-faint); }

  .pill{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em; padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .pill.danger{ background:var(--danger-dim); color:var(--danger); }
  .pill.warn{ background:var(--warn-dim); color:var(--warn); }
  .pill.ok{ background:var(--calm-dim); color:var(--calm); }
  .pill.neutral{ background:var(--surface-2); color:var(--text-faint); }

  .center-note{ text-align:center; padding:22vh 20px 20px; color:var(--text-dim); font-size:14px; line-height:1.6; }
  .center-note .brand{ font-size:25px; margin-bottom:14px; display:block; }
  button.google-btn{ display:flex; align-items:center; gap:10px; background:#fff; color:#1F1F1F; border:none; font-weight:600; font-size:14px; padding:12px 22px; border-radius:8px; cursor:pointer; font-family:var(--sans); margin:18px auto 0; }
  .empty-hint{ padding:18px; color:var(--text-faint); font-size:12.5px; text-align:center; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .eyebrow{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:10px; }
  .field-label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
  .card input, .card select, .card textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-family:var(--sans); font-size:13px; padding:9px 10px; border-radius:7px; margin-bottom:10px;
  }
  .card input:focus, .card select:focus, .card textarea:focus{ outline:none; border-color:var(--calm-dim); }
  button.ghost{
    background:var(--calm-dim); color:var(--text); border:1px solid var(--calm-dim);
    font-family:var(--sans); font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:7px; cursor:pointer;
  }
  button.ghost:hover{ border-color:var(--calm); }
  button.ghost.danger{ background:var(--danger-dim); border-color:var(--danger-dim); }
  button.ghost.danger:hover{ border-color:var(--danger); }
  button.ghost[disabled]{ opacity:.5; cursor:not-allowed; }
  .btn-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .back-link{ display:inline-block; margin-bottom:14px; color:var(--text-dim); font-size:12.5px; cursor:pointer; text-decoration:underline; }
</style>
</head>
<body>
<div id="app"><div class="center-note">Cargando…</div></div>
<script src="/site-common.js"></script>
<script src="/radar.js"></script>
</body>
</html>
